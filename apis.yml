name: 13th Lab
description: '13th Lab was a Stockholm-based computer vision startup founded in 2012 that built SLAM (Simultaneous Localization and Mapping) technology for mobile devices, letting phones detect and track 2D and 3D objects through the camera in real time. Its products included the PointCloud iOS SDK, the PointCloud library, and the Minecraft Reality app. Backed by Creandum, GP Bullhound, and angel investor Gustav Soderstrom, the company was acquired by Oculus VR (Facebook) in December 2014 for a reported SEK 195M (~$25M), where its team went on to develop standalone inside-out tracking for VR headsets (Oculus Insight). 13th Lab no longer operates as an independent company and publishes no live website, developer portal, or API surface; this profile is retained as a historical identity record.'
